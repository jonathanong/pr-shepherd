name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: lint / typecheck / test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        node-version: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: Eval cases are in sync with their snapshots
        run: |
          node evals/generate.mjs
          # `git diff` alone ignores untracked files, so a generated-but-uncommitted
          # case directory would pass while the committed suite stays incomplete.
          # Staging first makes additions, deletions and modifications all visible.
          git add -A -- evals/
          git diff --cached --exit-code -- evals/ \
            || { echo "::error::evals/ is out of sync - run 'node evals/generate.mjs' and commit the result"; exit 1; }
      - run: npm run test:coverage
      - name: Upload test results to Codecov
        if: ${{ always() && !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          report_type: test_results
          files: ./test-results/junit.xml
      - name: Upload coverage to Codecov
        if: ${{ always() && !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true

  site:
    name: site build
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node site/build.mjs
