query PollStackSummary(
  $owner: String!
  $repo: String!
  $anchor: Int!
  $first: Int!
  $after: String
) {
  _shepherdRateLimit: rateLimit {
    cost
    limit
    nodeCount
    remaining
    resetAt
    used
  }
  viewer {
    login
  }
  repository(owner: $owner, name: $repo) {
    viewerCanAdminister
    mergeCommitAllowed
    squashMergeAllowed
    rebaseMergeAllowed
    pullRequest(number: $anchor) {
      stack {
        id
        number
        size
        baseRefName
        entries(first: $first, after: $after) {
          pageInfo {
            hasNextPage
            endCursor
          }
          nodes {
            position
            pullRequest {
              ...PollSummaryPr
            }
          }
        }
      }
    }
  }
}
