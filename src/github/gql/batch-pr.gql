# First page only. Extra pages use batch-pr-page.gql so follow-ups do not
# re-select every connection (GraphQL points scale with possible nodes).
query BatchPr($owner: String!, $repo: String!, $pr: Int!) {
  _shepherdRateLimit: rateLimit {
    cost
    limit
    nodeCount
    remaining
    resetAt
    used
  }
  repository(owner: $owner, name: $repo) {
    viewerPermission
    viewerCanAdminister
    pullRequest(number: $pr) {
      id
      number
      updatedAt
      state
      isDraft
      viewerDidAuthor
      viewerCanUpdate
      viewerCanEnableAutoMerge
      viewerCanEditFiles
      mergeable
      mergeStateStatus
      reviewDecision
      headRefOid
      headRefName
      headRepository {
        nameWithOwner
        viewerPermission
      }
      baseRefName
      isInMergeQueue
      ...PrMergePolicy
      autoMergeRequest {
        enabledAt
        mergeMethod
        enabledBy {
          login
        }
      }
      mergeQueueEntry {
        position
        state
        estimatedTimeToMerge
        enqueuedAt
        enqueuer {
          login
        }
        headCommit {
          oid
          committedDate
        }
      }
      mergeQueueAdditions: timelineItems(last: 1, itemTypes: [ADDED_TO_MERGE_QUEUE_EVENT]) {
        nodes {
          ... on AddedToMergeQueueEvent {
            createdAt
          }
        }
      }
      mergeQueueRemovals: timelineItems(last: 1, itemTypes: [REMOVED_FROM_MERGE_QUEUE_EVENT]) {
        nodes {
          ... on RemovedFromMergeQueueEvent {
            reason
            createdAt
            actor {
              login
            }
            beforeCommit {
              oid
              committedDate
              parents(first: 100) {
                nodes {
                  oid
                }
              }
            }
          }
        }
      }
      stack {
        number
        size
        baseRefName
      }
      stackEntry {
        position
      }
      # Not paginated — capped at 50; PRs with more pending reviewers truncate silently.
      reviewRequests(last: 50) {
        nodes {
          requestedReviewer {
            ... on Bot {
              login
            }
            ... on User {
              login
            }
            ... on Team {
              name
            }
          }
        }
      }
      # Not paginated — capped at 100 distinct reviewers; PRs with more are not plausible
      # in practice. Used to derive which CHANGES_REQUESTED rows are superseded by a later
      # APPROVED/DISMISSED review from the same author.
      latestReviews(last: 100) {
        nodes {
          author {
            __typename
            login
          }
          state
        }
      }
      reviewThreads(last: 100) {
        totalCount
        pageInfo {
          hasPreviousPage
          startCursor
        }
        nodes {
          id
          isResolved
          isOutdated
          viewerCanReply
          viewerCanResolve
          path
          line
          startLine
          comments(first: 100) {
            pageInfo {
              hasNextPage
              endCursor
            }
            nodes {
              id
              isMinimized
              url
              authorAssociation
              viewerDidAuthor
              author {
                __typename
                login
              }
              pullRequestReview {
                id
              }
              body
              path
              line
              startLine
              createdAt
            }
          }
        }
      }
      comments(last: 100) {
        totalCount
        pageInfo {
          hasPreviousPage
          startCursor
        }
        nodes {
          id
          isMinimized
          viewerCanMinimize
          url
          authorAssociation
          author {
            __typename
            login
          }
          body
          createdAt
        }
      }
      changesRequestedReviews: reviews(states: CHANGES_REQUESTED, last: 50) {
        pageInfo {
          hasPreviousPage
          startCursor
        }
        nodes {
          id
          authorAssociation
          author {
            __typename
            login
          }
          body
          createdAt
          commit {
            oid
          }
        }
      }
      reviewSummaries: reviews(states: COMMENTED, last: 50) {
        pageInfo {
          hasPreviousPage
          startCursor
        }
        nodes {
          id
          isMinimized
          viewerCanMinimize
          authorAssociation
          author {
            __typename
            login
          }
          body
          createdAt
        }
      }
      allReviews: reviews(last: 1) {
        totalCount
        nodes {
          id
        }
      }
      approvedReviews: reviews(states: APPROVED, last: 50) {
        pageInfo {
          hasPreviousPage
          startCursor
        }
        nodes {
          id
          isMinimized
          viewerCanMinimize
          authorAssociation
          author {
            __typename
            login
          }
          body
          createdAt
        }
      }
      commits(last: 1) {
        totalCount
        nodes {
          commit {
            oid
            committedDate
            checkSuites(first: 50) {
              pageInfo {
                hasNextPage
              }
              nodes {
                id
                conclusion
                workflowRun {
                  databaseId
                  event
                  url
                  workflow {
                    name
                  }
                }
              }
            }
            statusCheckRollup {
              state
              contexts(first: 100) {
                pageInfo {
                  hasNextPage
                  endCursor
                }
                nodes {
                  __typename
                  ... on CheckRun {
                    id
                    name
                    status
                    conclusion
                    detailsUrl
                    completedAt
                    startedAt
                    title
                    summary
                    annotations(first: 1) {
                      nodes {
                        message
                      }
                    }
                    checkSuite {
                      createdAt
                      updatedAt
                      workflowRun {
                        event
                        createdAt
                        updatedAt
                        workflow {
                          name
                          databaseId
                        }
                      }
                    }
                  }
                  ... on StatusContext {
                    context
                    state
                    createdAt
                    targetUrl
                    description
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
