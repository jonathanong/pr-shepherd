# First page only. Extra pages use batch-pr-page.gql so follow-ups do not
# re-select every connection (GraphQL points scale with possible nodes).
query BatchPr($owner: String!, $repo: String!, $pr: Int!) {
  repository(owner: $owner, name: $repo) {
    viewerPermission
    viewerCanAdminister
    pullRequest(number: $pr) {
      id
      number
      state
      isDraft
      viewerDidAuthor
      viewerCanUpdate
      viewerCanEnableAutoMerge
      viewerCanEditFiles
      mergeable
      mergeStateStatus
      reviewDecision
      headRefOid
      headRefName
      headRepository {
        nameWithOwner
        viewerPermission
      }
      baseRefName
      isInMergeQueue
      isMergeQueueEnabled
      autoMergeRequest {
        enabledAt
        mergeMethod
        enabledBy {
          login
        }
      }
      mergeQueueEntry {
        position
        state
        estimatedTimeToMerge
        enqueuedAt
        enqueuer {
          login
        }
        headCommit {
          ...QueueCheckCommit
        }
      }
      mergeQueueAdditions: timelineItems(last: 1, itemTypes: [ADDED_TO_MERGE_QUEUE_EVENT]) {
        nodes {
          ... on AddedToMergeQueueEvent {
            createdAt
          }
        }
      }
      mergeQueueRemovals: timelineItems(last: 1, itemTypes: [REMOVED_FROM_MERGE_QUEUE_EVENT]) {
        nodes {
          ... on RemovedFromMergeQueueEvent {
            reason
            createdAt
            actor {
              login
            }
            beforeCommit {
              ...QueueCheckCommit
            }
          }
        }
      }
      stack {
        number
        size
        baseRefName
      }
      stackEntry {
        position
      }
      baseRef {
        branchProtectionRule {
          requiresApprovingReviews
          requiredApprovingReviewCount
          requiresConversationResolution
          requiresCodeOwnerReviews
          requireLastPushApproval
          requiresCommitSignatures
          requiresLinearHistory
          requiresStatusChecks
          requiredStatusCheckContexts
          requiresStrictStatusChecks
          requiresDeployments
          requiredDeploymentEnvironments
        }
        rules(first: 100) {
          nodes {
            type
            parameters {
              ... on PullRequestParameters {
                requiredApprovingReviewCount
                requiredReviewThreadResolution
                requireCodeOwnerReview
                requireLastPushApproval
              }
              ... on RequiredStatusChecksParameters {
                strictRequiredStatusChecksPolicy
                requiredStatusChecks {
                  context
                }
              }
              ... on RequiredDeploymentsParameters {
                requiredDeploymentEnvironments
              }
              ... on CodeScanningParameters {
                codeScanningTools {
                  tool
                }
              }
            }
          }
        }
      }
      # Not paginated — capped at 50; PRs with more pending reviewers truncate silently.
      reviewRequests(last: 50) {
        nodes {
          requestedReviewer {
            ... on Bot {
              login
            }
            ... on User {
              login
            }
            ... on Team {
              name
            }
          }
        }
      }
      # Not paginated — capped at 100 distinct reviewers; PRs with more are not plausible
      # in practice. Used to derive which CHANGES_REQUESTED rows are superseded by a later
      # APPROVED/DISMISSED review from the same author.
      latestReviews(last: 100) {
        nodes {
          author {
            __typename
            login
          }
          state
        }
      }
      reviewThreads(last: 100) {
        pageInfo {
          hasPreviousPage
          startCursor
        }
        nodes {
          id
          isResolved
          isOutdated
          viewerCanReply
          viewerCanResolve
          path
          line
          startLine
          comments(first: 100) {
            pageInfo {
              hasNextPage
              endCursor
            }
            nodes {
              id
              isMinimized
              url
              authorAssociation
              viewerDidAuthor
              author {
                __typename
                login
              }
              pullRequestReview {
                id
              }
              body
              path
              line
              startLine
              createdAt
            }
          }
        }
      }
      comments(last: 100) {
        pageInfo {
          hasPreviousPage
          startCursor
        }
        nodes {
          id
          isMinimized
          viewerCanMinimize
          url
          authorAssociation
          author {
            __typename
            login
          }
          body
          createdAt
        }
      }
      changesRequestedReviews: reviews(states: CHANGES_REQUESTED, last: 50) {
        pageInfo {
          hasPreviousPage
          startCursor
        }
        nodes {
          id
          authorAssociation
          author {
            __typename
            login
          }
          body
          createdAt
          commit {
            oid
          }
        }
      }
      reviewSummaries: reviews(states: COMMENTED, last: 50) {
        pageInfo {
          hasPreviousPage
          startCursor
        }
        nodes {
          id
          isMinimized
          viewerCanMinimize
          authorAssociation
          author {
            __typename
            login
          }
          body
          createdAt
        }
      }
      allReviews: reviews(last: 1) {
        totalCount
      }
      approvedReviews: reviews(states: APPROVED, last: 50) {
        pageInfo {
          hasPreviousPage
          startCursor
        }
        nodes {
          id
          isMinimized
          viewerCanMinimize
          authorAssociation
          author {
            __typename
            login
          }
          body
          createdAt
        }
      }
      commits(last: 1) {
        totalCount
        nodes {
          commit {
            oid
            committedDate
            checkSuites(first: 50) {
              pageInfo {
                hasNextPage
              }
              nodes {
                conclusion
                workflowRun {
                  databaseId
                  event
                  url
                  workflow {
                    name
                  }
                }
              }
            }
            statusCheckRollup {
              contexts(first: 100) {
                pageInfo {
                  hasNextPage
                  endCursor
                }
                nodes {
                  __typename
                  ... on CheckRun {
                    id
                    name
                    status
                    conclusion
                    detailsUrl
                    completedAt
                    startedAt
                    title
                    summary
                    annotations(first: 1) {
                      nodes {
                        message
                      }
                    }
                    checkSuite {
                      createdAt
                      updatedAt
                      workflowRun {
                        event
                        createdAt
                        updatedAt
                        workflow {
                          name
                          databaseId
                        }
                      }
                    }
                  }
                  ... on StatusContext {
                    context
                    state
                    createdAt
                    targetUrl
                    description
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}

fragment QueueCheckCommit on Commit {
  oid
  committedDate
  parents(first: 100) {
    nodes {
      oid
    }
  }
  statusCheckRollup {
    contexts(first: 100) {
      pageInfo {
        hasNextPage
        endCursor
      }
      nodes {
        __typename
        ... on CheckRun {
          id
          name
          status
          conclusion
          detailsUrl
          completedAt
          startedAt
          title
          summary
          annotations(first: 1) {
            nodes {
              message
            }
          }
          checkSuite {
            createdAt
            updatedAt
            workflowRun {
              event
              createdAt
              updatedAt
              workflow {
                name
                databaseId
              }
            }
          }
        }
        ... on StatusContext {
          context
          state
          createdAt
          targetUrl
          description
        }
      }
    }
  }
}
