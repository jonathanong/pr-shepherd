fragment CommitCheckSuites on Commit {
  checkSuites(first: 50) {
    pageInfo {
      hasNextPage
    }
    nodes {
      id
      createdAt
      status
      conclusion
      app {
        slug
      }
      workflowRun {
        databaseId
        event
        url
        workflow {
          name
        }
        file {
          path
        }
      }
    }
  }
}
