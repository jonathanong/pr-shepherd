fragment PollSummaryPr on PullRequest {
  # Scalars and objects below marked "handoff" add no connection, so the stack
  # summary keeps its price; they let a routed layer's first tick skip BatchPr.
  id
  number
  title
  url
  author {
    __typename
    login
  }
  state
  updatedAt
  isDraft
  viewerCanUpdate
  # handoff
  viewerDidAuthor
  viewerCanEnableAutoMerge
  viewerCanEditFiles
  headRepository {
    nameWithOwner
    viewerPermission
  }
  isMergeQueueEnabled
  # Aliased: the summary's own `autoMergeRequest` is the REST-projected status.
  batchAutoMergeRequest: autoMergeRequest {
    enabledAt
    mergeMethod
    enabledBy {
      login
    }
  }
  headRefName
  headRefOid
  baseRefName
  baseRefOid
  baseRef {
    ...RefRules
    # handoff: the live base tip
    target {
      oid
    }
  }
  mergeable
  mergeStateStatus
  lifecycleEvents: timelineItems(
    last: 1
    itemTypes: [CLOSED_EVENT, REOPENED_EVENT, CONVERT_TO_DRAFT_EVENT, READY_FOR_REVIEW_EVENT]
  ) {
    nodes {
      __typename
      ... on ClosedEvent {
        createdAt
      }
      ... on ReopenedEvent {
        createdAt
      }
      ... on ConvertToDraftEvent {
        createdAt
      }
      ... on ReadyForReviewEvent {
        createdAt
      }
    }
  }
  reviewDecision
  reviewRequests(last: 50) {
    nodes {
      requestedReviewer {
        __typename
        ... on User {
          login
        }
        ... on Bot {
          login
        }
        ... on Mannequin {
          login
        }
        ... on Team {
          name
        }
      }
    }
  }
  latestReviews(last: 50) {
    nodes {
      state
      author {
        __typename
        login
      }
    }
  }
  isInMergeQueue
  mergeQueueAdditions: timelineItems(last: 1, itemTypes: [ADDED_TO_MERGE_QUEUE_EVENT]) {
    nodes {
      ... on AddedToMergeQueueEvent {
        createdAt
      }
    }
  }
  mergeQueueRemovals: timelineItems(last: 1, itemTypes: [REMOVED_FROM_MERGE_QUEUE_EVENT]) {
    nodes {
      ... on RemovedFromMergeQueueEvent {
        id
        reason
        createdAt
        actor {
          login
        }
        beforeCommit {
          oid
          parents(first: 100) {
            nodes {
              oid
            }
          }
        }
      }
    }
  }
  headRefForcePushes: timelineItems(last: 1, itemTypes: [HEAD_REF_FORCE_PUSHED_EVENT]) {
    nodes {
      ... on HeadRefForcePushedEvent {
        createdAt
      }
    }
  }
  mergeQueueEntry {
    headCommit {
      oid
      statusCheckRollup {
        contexts(last: 100) {
          ...PollSummaryCheckContexts
        }
      }
    }
  }
  stack {
    number
    size
    baseRefName
  }
  stackEntry {
    position
  }
  comments(last: 100) {
    totalCount
    pageInfo {
      hasPreviousPage
    }
    nodes {
      id
      body
      isMinimized
      viewerCanMinimize
      url
      authorAssociation
      author {
        __typename
        login
      }
      createdAt
      updatedAt
    }
  }
  reviews(last: 100) {
    totalCount
    pageInfo {
      hasPreviousPage
    }
    nodes {
      id
      body
      state
      isMinimized
      viewerCanMinimize
      authorAssociation
      author {
        __typename
        login
      }
      createdAt
      updatedAt
      url
      commit {
        oid
      }
    }
  }
  reviewThreads(last: 20) {
    totalCount
    pageInfo {
      hasPreviousPage
    }
    nodes {
      id
      isResolved
      isOutdated
      viewerCanReply
      viewerCanResolve
      path
      line
      startLine
      # One window from the root: a second nested connection would cost 20 more
      # connection-requests per PR. `hasPreviousPage` marks comments outside it.
      comments(first: 5) {
        totalCount
        pageInfo {
          hasPreviousPage: hasNextPage
        }
        nodes {
          id
          isMinimized
          body
          url
          authorAssociation
          viewerDidAuthor
          author {
            __typename
            login
          }
          pullRequestReview {
            id
          }
          path
          line
          startLine
          createdAt
          updatedAt
        }
      }
    }
  }
  commits(last: 1) {
    totalCount
    nodes {
      commit {
        oid
        committedDate
        checkSuites(first: 50) {
          pageInfo {
            hasNextPage
          }
          nodes {
            id
            status
            conclusion
            workflowRun {
              databaseId
              event
              url
              workflow {
                name
              }
            }
          }
        }
        statusCheckRollup {
          state
          contexts(last: 100) {
            ...PollSummaryCheckContexts
          }
        }
      }
    }
  }
}
