# Cheap preflight. Cost is 1. Used to skip BatchPr when GitHub state is unchanged.
query PrFingerprint($owner: String!, $repo: String!, $pr: Int!) {
  _shepherdRateLimit: rateLimit {
    cost
    limit
    nodeCount
    remaining
    resetAt
    used
  }
  repository(owner: $owner, name: $repo) {
    viewerPermission
    pullRequest(number: $pr) {
      updatedAt
      state
      isDraft
      viewerCanUpdate
      headRefOid
      mergeable
      mergeStateStatus
      reviewDecision
      isInMergeQueue
      ...PrMergePolicy
      comments(last: 1) {
        totalCount
        nodes {
          id
        }
      }
      reviewThreads(last: 1) {
        totalCount
        nodes {
          id
        }
      }
      reviews(last: 1) {
        totalCount
        nodes {
          id
        }
      }
      commits(last: 1) {
        nodes {
          commit {
            oid
            statusCheckRollup {
              state
            }
            checkSuites(first: 50) {
              pageInfo {
                hasNextPage
              }
              nodes {
                id
                conclusion
                workflowRun {
                  databaseId
                }
              }
            }
          }
        }
      }
    }
  }
}
