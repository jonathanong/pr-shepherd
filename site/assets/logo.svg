<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="pr-shepherd">
  <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- staff: the P stem, with a crook at the top -->
    <path d="M30,22 Q30,10 41,10 Q47,10 47,16 Q47,23 37,23" />
    <path d="M30,20 L30,86" />
    <!-- left arm reaching to the staff: the P bowl -->
    <path d="M30,24 Q64,36 30,50" />
    <!-- torso continuing into the straight left leg: the R stem -->
    <path d="M56,24 L52,86" />
    <!-- right arm: the R bowl -->
    <path d="M56,25 Q82,34 55,52" />
    <!-- right leg kicked out: the R diagonal -->
    <path d="M53,64 L78,86" />
  </g>
  <circle cx="56" cy="15" r="7" fill="currentColor" />
</svg>
