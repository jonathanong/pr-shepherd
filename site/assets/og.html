<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>pr-shepherd — Open Graph image</title>
<style>
  @font-face {
    font-family: "mono-fallback";
  }
  html, body {
    margin: 0;
    width: 1200px;
    height: 630px;
    background: #0a0d0c;
    color: #e7efe9;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  .wrap {
    width: 1200px;
    height: 630px;
    box-sizing: border-box;
    padding: 80px 90px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    background:
      radial-gradient(circle at 85% 10%, rgba(52, 214, 127, 0.18), transparent 45%),
      #0a0d0c;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 48px;
  }
  .brand svg {
    display: block;
    width: 48px;
    height: 48px;
  }
  .brand span {
    font-size: 28px;
    font-weight: 600;
  }
  .kicker {
    color: #34d67f;
    font-size: 22px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 18px;
  }
  h1 {
    font-size: 58px;
    line-height: 1.2;
    margin: 0 0 26px;
  }
  p {
    font-size: 26px;
    color: #93a39a;
    max-width: 860px;
    margin: 0;
    line-height: 1.5;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="pr-shepherd">
      <g fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M30,22 Q30,10 41,10 Q47,10 47,16 Q47,23 37,23" />
        <path d="M30,20 L30,86" />
        <path d="M30,24 Q64,36 30,50" />
        <path d="M56,24 L52,86" />
        <path d="M56,25 Q82,34 55,52" />
        <path d="M53,64 L78,86" />
      </g>
      <circle cx="56" cy="15" r="7" fill="currentColor" />
    </svg>
    <span>pr-shepherd</span>
  </div>
  <p class="kicker">for agents finishing pull requests</p>
  <h1>Deterministic Draft &rarr; Merged<br>PRs for agents</h1>
  <p>Gather all PR context in one poll. Get back exactly one next action:
  WAIT, MARK_READY, FIX_CODE, MERGE, CANCEL, or ESCALATE.</p>
</div>
</body>
</html>
